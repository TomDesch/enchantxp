name: EnchantXP

version: 0.2.0-alpha.5

main: io.github.stealingdapenta.enchantxp.EnchantXpPlugin

description: Choose vanilla enchantments at a table for raw experience points.

commands:
  enchantxp:
    description: Show available commands, edit settings in-game or reload config.yml.
    usage: /enchantxp <help|config|reload>

permissions:
  enchantxp.use:
    description: Use enchanting tables in Survival or Creative mode.
    default: true
  enchantxp.reload:
    description: Reload EnchantXP configuration without restarting the server.
    default: op
  enchantxp.config:
    description: Edit and save EnchantXP settings in-game.
    default: op
