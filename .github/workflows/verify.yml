name: Verify

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp verify

      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: ./mvnw -B -ntp verify

      - name: Test artifact inspection
        shell: python
        run: |
          import runpy
          runpy.run_path("scripts/test_verify_artifact.py", run_name="__main__")

      - name: Inspect deployment JAR
        id: artifact
        shell: pwsh
        run: |
          python scripts/verify_artifact.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$pom = Get-Content pom.xml
          "path=target/$($pom.project.artifactId)-$($pom.project.version).jar" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enchantxp-${{ matrix.os }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7
